name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ai_chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_URL: postgres://test:test@localhost:5432/ai_chat_test
      AZURE_FOUNDRY_API_KEY: test-key
      AZURE_FOUNDRY_GPT_URL: https://example-test.services.ai.azure.com/models
      TRUST_COOKIE_SECRET: test-trust-secret
      ANON_COOKIE_SECRET: test-anon-secret

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          # .nvmrc is the single source of truth for the Node version, shared
          # with local `nvm use`. Keep the floor in package.json `engines`.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Test
        run: pnpm test
